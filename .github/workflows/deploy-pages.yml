name: Deploy Flutter web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      TODO_API_BASE_URL: ${{ secrets.TODO_API_BASE_URL }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for deployment settings
        if: ${{ env.TODO_API_BASE_URL == '' }}
        run: echo "Deployment skipped. Add the TODO_API_BASE_URL secret and enable GitHub Pages to publish the app."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        if: ${{ env.TODO_API_BASE_URL != '' }}
        with:
          channel: stable
          cache: true

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
        if: ${{ env.TODO_API_BASE_URL != '' }}

      - name: Install Flutter packages
        run: flutter pub get
        if: ${{ env.TODO_API_BASE_URL != '' }}

      - name: Build Flutter web app
        if: ${{ env.TODO_API_BASE_URL != '' }}
        run: |
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define="API_BASE_URL=$TODO_API_BASE_URL"

      - name: Upload web app
        uses: actions/upload-pages-artifact@v4
        if: ${{ env.TODO_API_BASE_URL != '' }}
        with:
          path: build/web

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: ${{ env.TODO_API_BASE_URL != '' }}
